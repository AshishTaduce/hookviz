name: Report a bug
description: Something in the player or the site is broken
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page where it happens
      placeholder: https://hookviz.ashishtaduce.co.in/usestate-counter
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Firefox 130 on Android
